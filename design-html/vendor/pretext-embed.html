<script type="text/plain" id="pretext-src">

</script>
<script type="module">
const pretextURL = URL.createObjectURL(new Blob([document.getElementById('pretext-src').text], { type: 'text/javascript' }))
const { prepare, layout, prepareWithSegments, walkLineRanges, layoutNextLine, layoutWithLines } = await import(pretextURL).finally(() => URL.revokeObjectURL(pretextURL))
// page code
</script>
