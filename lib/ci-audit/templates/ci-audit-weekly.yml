# Weekly CI audit (gstack /ci-audit), report-only.
# Copy to .github/workflows/ci-audit-weekly.yml. Every Saturday at 15:00 UTC
# (8 AM Pacific in summer, 7 AM in winter) it measures this repo's GitHub Actions
# runs and keeps one open "Weekly CI audit" issue current: a complete run creates or
# replaces it, or closes it when nothing is left to fix; a partial or failed run
# comments and keeps the last complete findings. It never edits code.
name: Weekly CI audit

on:
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-audit-weekly
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      # Pin a gstack tag or commit here to control upgrades.
      GSTACK_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - name: Fetch gstack
        run: git clone --quiet --depth 1 --branch "$GSTACK_REF" https://github.com/garrytan/gstack "$RUNNER_TEMP/gstack"
      - name: Audit
        id: audit
        # GITHUB_TOKEN allows 1,000 API calls an hour; the run refuses to start below its budget plus 500.
        run: |
          set +e
          "$RUNNER_TEMP/gstack/bin/gstack-ci-audit" run --repo "$GITHUB_REPOSITORY" --since-days 7 --runs-per-workflow 10 --logs 5 --max-calls 400 --out audit.json > audit.md 2> audit.err
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat audit.md audit.err
      - name: Publish
        if: always()
        run: |
          "$RUNNER_TEMP/gstack/bin/gstack-ci-audit" publish --repo "$GITHUB_REPOSITORY" --exit "${{ steps.audit.outputs.code || 5 }}" --report audit.json --error-file audit.err --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-audit
          path: |
            audit.json
            audit.md
          retention-days: 30
