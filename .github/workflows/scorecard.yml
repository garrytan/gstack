name: OpenSSF Scorecard
# Supply-chain posture report (#1997): pinned actions, token permissions,
# branch protection, dangerous workflow patterns. Results land in the
# Security tab as code-scanning alerts and are published to
# api.scorecard.dev for the badge.
#
# Publishing imposes rules this file must keep: no workflow-level env,
# defaults or write permissions; `id-token: write` only on the job that runs
# ossf/scorecard-action; that job uses only approved actions on a GitHub
# hosted Ubuntu runner, with no env, defaults, containers or `run:` steps.
# Scorecard does not support forks, so the job runs only in this repository.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: github.repository == 'garrytan/gstack'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
